name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  laravel:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, dom, fileinfo
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Configure application key
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Laravel tests
        run: php artisan test

      - name: Check formatting
        run: >-
          vendor/bin/pint --test
          app/Http/Controllers/SuperAdmin/TenantController.php
          app/Http/Middleware/AuthenticateTenantApiKey.php
          app/Models/Tenant.php
          routes/api.php
          database/migrations/2026_11_18_000004_add_api_key_last_used_at_to_tenants.php
          tests/Feature/WebsiteApiTest.php
          tests/Feature/SuperAdminTenantManagementTest.php
